{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password</h1><p class="muted">Use a unique password with at least 12 characters.</p></div></div>
<div class="form-card narrow-card"><form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="current_password">Current password</label><input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
  <div class="mb-3"><label class="form-label" for="new_password">New password</label><input class="form-control" id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password" required></div>
  <div class="mb-4"><label class="form-label" for="confirm_password">Confirm new password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div>
  <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Update password</button><a class="btn btn-outline-secondary" href="{{ url_for('main.dashboard') }}">Cancel</a></div>
</form></div>
{% endblock %}
